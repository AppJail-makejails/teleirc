SHOW_ACTION_MESSAGE="${TELEIRC_SHOW_ACTION_MESSAGE}"
SHOW_JOIN_MESSAGE="${TELEIRC_SHOW_JOIN_MESSAGE}"
JOIN_MESSAGE_ALLOW_LIST="${TELEIRC_JOIN_MESSAGE_ALLOW_LIST}"
